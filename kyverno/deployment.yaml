apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyverno
  labels:
    app: kyverno
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kyverno
  template:
    metadata:
      labels:
        app: kyverno
    spec:
      containers:
        - name: kyverno
          image: ghcr.io/kyverno/kyverno:v1.11.0
          args:
            - -v=2
          ports:
            - containerPort: 9443
          env:
            - name: KYVERNO_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KYVERNO_SERVICEACCOUNT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
